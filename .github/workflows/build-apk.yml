name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: App icon (from site icon)
        run: |
          pip install pillow
          python make-icons.py

      - name: Back button handling (go back in website history)
        run: cp MainActivity.java android/app/src/main/java/np/com/pratikadhikari98/shastri/MainActivity.java

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: shastri-portal-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
